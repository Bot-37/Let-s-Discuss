<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threads | Let's Discuss</title>
  <link rel="icon" type="image/png" href="assets/incognito.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="runtime-config.js"></script>
  <script src="js/app.js" defer></script>
</head>
<body>

<header>
  <div class="logo">
    <a href="index.html" style="text-decoration: none; color: inherit;">
      <h1>LET'S DISCUSS</h1>
    </a>
  </div>
  <div class="header-actions">
    <a href="dashboard.html" class="nav-link" onclick="event.preventDefault(); openDashboard();">Dashboard</a>
    <span class="user-badge">Anonymous #A91F</span>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" aria-pressed="false" title="Toggle theme"></button>
  </div>
</header>

<main class="threads-page">
  <div class="page-header">
    <div>
      <h2>Discussion Threads</h2>
      <p class="page-subtitle">Browse active conversations or start something new</p>
    </div>
    <button class="btn-primary" onclick="showNewThreadModal()">+ New Thread</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="hot">
      <span class="filter-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img" focusable="false">
          <path d="M14.5 2.5c.3 2.8-1 4.2-2.2 5.6-1.3 1.4-2.4 2.7-2 5 .3 1.7 1.8 3.2 3.7 3.2 2.6 0 4.4-2.1 4.4-4.8 0-2.5-1.4-4.5-3.9-9Z" />
          <path d="M8.2 11.2c-1.6 1.3-2.7 3.1-2.7 5.2 0 3.1 2.5 5.6 5.6 5.6h2c3.1 0 5.6-2.5 5.6-5.6 0-.9-.2-1.7-.6-2.5" />
        </svg>
      </span>
      Hot
    </button>
    <button class="filter-btn" data-filter="new">
      <span class="filter-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img" focusable="false">
          <path d="m12 3 1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3Z" />
          <path d="m18.5 14 1 2.6 2.5 1-2.5 1-1 2.4-1-2.4-2.5-1 2.5-1 1-2.6Z" />
        </svg>
      </span>
      New
    </button>
    <button class="filter-btn" data-filter="top">
      <span class="filter-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img" focusable="false">
          <path d="M7 4h10v3.5a5 5 0 0 1-2.1 4.1L12 13.8 9.1 11.6A5 5 0 0 1 7 7.5V4Z" />
          <path d="M9.2 15.5h5.6M10 18h4M5 6H3v1a3 3 0 0 0 3 3M19 6h2v1a3 3 0 0 1-3 3" />
        </svg>
      </span>
      Top
    </button>
  </div>

  <div id="threadsList" class="threads-list"></div>
</main>

<!-- New Thread Modal -->
<div id="newThreadModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Start a New Thread</h3>
      <button class="modal-close" onclick="closeNewThreadModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="text" id="threadTitle" placeholder="Thread title..." maxlength="200" />
      <textarea id="threadContent" placeholder="Share your thoughts (optional)..." rows="6"></textarea>
      <div class="modal-actions">
        <button class="btn-outline" onclick="closeNewThreadModal()">Cancel</button>
        <button class="btn-primary" onclick="createThread()">Create Thread</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
